<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopKart - E-Commerce</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <div class="logo">🛍️ ShopKart</div>

        <input type="text" placeholder="Search for products...">

        <div class="nav-icons">
            🛒 👤
        </div>
    </header>


    <!-- Main Container -->
    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h3>Filters</h3>

            <h4>Category</h4>
            <label><input type="checkbox"> Laptops</label>
            <label><input type="checkbox"> Desktops</label>
            <label><input type="checkbox"> Tablets</label>
            <label><input type="checkbox"> Accessories</label>

            <h4>Price Range</h4>
            <label><input type="checkbox"> ₹20,000 - ₹40,000</label>
            <label><input type="checkbox"> ₹40,000 - ₹60,000</label>
            <label><input type="checkbox"> ₹60,000+</label>

            <h4>Brand</h4>
            <label><input type="checkbox"> Dell</label>
            <label><input type="checkbox"> HP</label>
            <label><input type="checkbox"> Lenovo</label>
            <label><input type="checkbox"> Apple</label>

            <button>Apply Filters</button>
        </aside>


        <!-- Products -->
        <main class="products-section">

            <div class="top">
                <p>Showing 6 products</p>
                <select>
                    <option>Popularity</option>
                    <option>Price Low to High</option>
                    <option>Price High to Low</option>
                </select>
            </div>


            <div class="products">

                <!-- Product 1 -->
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1593642702821-c8da6771f0c6?w=400" alt="Laptop">

                    <div class="card-info">
                        <h3>Dell Inspiron 15</h3>
                        <p class="price">₹45,000</p>
                        <p class="rating">⭐ 4.5 (120)</p>
                        <button>Add to Cart</button>
                    </div>
                </div>


                <!-- Product 2 -->
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1603302576837-37561b2e2302?w=400" alt="Laptop">

                    <div class="card-info">
                        <h3>HP Pavilion</h3>
                        <p class="price">₹52,000</p>
                        <p class="rating">⭐ 4.3 (98)</p>
                        <button>Add to Cart</button>
                    </div>
                </div>


                <!-- Product 3 -->
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=400" alt="Laptop">

                    <div class="card-info">
                        <h3>Lenovo IdeaPad</h3>
                        <p class="price">₹38,000</p>
                        <p class="rating">⭐ 4.2 (85)</p>
                        <button>Add to Cart</button>
                    </div>
                </div>


                <!-- Product 4 -->
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1611186871348-b1ce696e52c9?w=400" alt="MacBook">

                    <div class="card-info">
                        <h3>MacBook Air M2</h3>
                        <p class="price">₹90,000</p>
                        <p class="rating">⭐ 4.8 (210)</p>
                        <button>Add to Cart</button>
                    </div>
                </div>


                <!-- Product 5 -->
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef?w=400" alt="Laptop">

                    <div class="card-info">
                        <h3>ASUS Vivobook</h3>
                        <p class="price">₹41,000</p>
                        <p class="rating">⭐ 4.1 (73)</p>
                        <button>Add to Cart</button>
                    </div>
                </div>


                <!-- Product 6 -->
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1517336714739-489689fd1ca8?w=400" alt="Laptop">

                    <div class="card-info">
                        <h3>Dell XPS 13</h3>
                        <p class="price">₹80,000</p>
                        <p class="rating">⭐ 4.6 (144)</p>
                        <button>Add to Cart</button>
                    </div>
                </div>

            </div>

        </main>

    </div>

</body>
</html>
