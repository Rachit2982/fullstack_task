<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        body{
            background-color: rgb(28, 27, 27);
            margin:0;
            padding:0;
        }
        #video{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        #video video{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .box{
            display:inline-block;
            
            width:100px;
            height:100px;

            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);
        }
        #box1{
            width: 200vh;
            height: 100vh;
            background:transparent;
            color: white;
            position:sticky;
            top:0;
            bottom:0;
            left:0;
        }
        #content1{
            font-size: 100px;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin-bottom: 0;
            margin-top: 30vh;
            
        }
        #content2{
            font-size: 50px;
            text-align: center;
            margin-top: 0;
        }
        
        #box2{
            width: 200vh;
            height: 100vh;
            background:transparent;
            position:sticky;
            top:30vh;
            left:0;
        }
        #box3{
            width: 200vh;
            height: 100vh;
            background:transparent;
            
            position:sticky;
            top:30vh;
            left:0;
        }
        #box4{
            width: 200vh;
            height: 100vh;
            background:transparent;
           
            position:sticky;
            top:30vh;
            left:0;
        }
        #box5{
            width: 200vh;
            height: 100vh;
            background:transparent;
            
            position:sticky;
            top:30vh;
            left:0;
        }
        #box6{
            width: 200vh;
            height: 100vh;
            background:transparent;
            position:sticky;
            top:30vh;
            left:0;
        }
        img{
            width: 90%;
            height: 55%;
            border-radius: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div >
        <div id="video">
            <video autoplay muted loop playsinline class="background-video">
            <source src="spideman.mp4" type="video/mp4">
            </video></video>
        </div>
        <div class ="box" id="box1"><p id="content1">SPIDER-MAN</p><br><p id="content2">VILLAINS</p></div>
        <div class="box" id="box2"><img src="spiderman1.jpg" alt="picture1"></div>
        <div class="box" id="box3"><img src="spiderman2.jpg" alt="picture2"></div>
        <div class="box" id="box4"><img src="spiderman3.jpg" alt="picture3"></div>
        <div class="box" id="box5"><img src="spiderman4.jpg" alt="picture4"></div>
        <div class="box" id="box6"><img src="spiderman5.jpg" alt="picture5"></div>
    </div>
    
</body>
</html>
