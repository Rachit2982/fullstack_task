<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento Grid</title>
    <style>
        :root{ --gap:12px; }
        body{ display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#f3f4f6; font-family:Arial,Helvetica,sans-serif }
        .bento{ display:grid; gap:var(--gap); width:720px; height:480px; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 1fr; grid-template-areas:
            "large small1 small2"
            "large small3 small4";
            background:transparent;
        }
        @media (max-width: 768px) {
            .bento {
                width: 90%;
                height: auto;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto auto;
                grid-template-areas:
                    "large large"
                    "small1 small2"
                    "small3 small4";
            }
        }
        .box{ background:#fff; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.08); display:flex; align-items:center; justify-content:center; font-weight:700; color:#111; font-size:18px }
        .box.large{ grid-area: large; }
        .box.s1{ grid-area: small1; }
        .box.s2{ grid-area: small2; }
        .box.s3{ grid-area: small3; }
        .box.s4{ grid-area: small4; }
        
        
    </style>
</head>
<body>
    <div class="bento">
        <div class="box large">Large</div>
        <div class="box s1">Box 1</div>
        <div class="box s2">Box 2</div>
        <div class="box s3">Box 3</div>
        <div class="box s4">Box 4</div>
    </div>
</body>
</html>
