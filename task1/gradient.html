<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #a99f95, #050404);
        }

        .gradient-background {
            font-size: 3rem;
            text-align: center;

            background: linear-gradient(to right, #37332e, #dbd8d6);

            background-clip: text;
            -webkit-background-clip: text;

            color: transparent;
            -webkit-text-fill-color: transparent;
        }
        
    </style>
</head>
<body>
    <h1 class="gradient-background">Gradient Background</h1>

</body>
</html>
