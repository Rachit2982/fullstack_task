<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: bisque;
        }
        div{
            display:inline-block;
            margin:10px;
            width:100px;
            height:100px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);
        }
        #box3{
            position:fixed;
            top:10%;
            left:10%;

        }
    </style>
</head>
<body>
    <div style="width: 100px; height: 100px; background-color: lightblue; box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);">1</div>
    <div style="width: 100px; height: 100px; background-color: rgb(184, 214, 52); box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);">2</div>
    <div id="box3" style="width: 100px; height: 100px; background-color: rgb(220, 230, 173); box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);">3</div>
    <div style="width: 100px; height: 100px; background-color: rgb(9, 77, 100); box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);">4</div>
    <div style="width: 100px; height: 100px; background-color: rgb(4, 41, 53); box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);">5</div>
    <div style="width: 100px; height: 100px; background-color: rgb(56, 133, 159); box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);">6</div>
    <div style="width: 100px; height: 100px; background-color: rgb(19, 22, 22); box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);">7</div>
    <div style="width: 100px; height: 100px; background-color: rgb(148, 182, 193); box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);">8</div>
</body>
</html>
