<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Pitch</title>
    <style>
        body {
            margin: 0;
            min-height: 220vh;
            background: linear-gradient(to bottom, #87ceeb 0%, #a0d8ef 45%, #3a8d3a 45%, #276529 100%);
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }
        #scene {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 100%;
            max-width: 900px;
            height: 100vh;
            pointer-events: none;
        }
        .cloud, #cloud {
            position: absolute;
            background: #fff;
            border-radius: 50px;
            box-shadow: 40px 10px 0 #fff, -35px 8px 0 #fff;
            opacity: 0.9;
        }
        .cloud {
            top: 40px;
            left: 12%;
            width: 180px;
            height: 60px;
        }
        #cloud {
            top: 40px;
            left: 64%;
            width: 160px;
            height: 50px;
            background: rgba(255,255,255,0.95);
            box-shadow: 40px 10px 0 rgba(255,255,255,0.95), -35px 8px 0 rgba(255,255,255,0.95);
        }
        .cloud::before, .cloud::after, #cloud::before, #cloud::after {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 50%;
        }
        .cloud::before, #cloud::before {
            width: 80px;
            height: 80px;
            left: -40px;
            top: -30px;
        }
        .cloud::after, #cloud::after {
            width: 90px;
            height: 90px;
            right: -30px;
            top: -35px;
        }
        .pitch {
            position: absolute;
            left: 50%;
            bottom: 60px;
            width: 260px;
            height: 420px;
            background: #c7b07f;
            transform: translateX(-50%);
            border-radius: 40px;
            box-shadow: inset 0 0 0 4px rgba(255,255,255,0.25);
        }
        .stumps {
            position: absolute;
            bottom: 42px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }
        .stump {
            width: 10px;
            height: 70px;
            background: #7a4f2e;
            border-radius: 6px;
        }
        #bat {
            position: absolute;
            left: 50%;
            bottom: 140px;
            width: 20px;
            height: 140px;
            background: #a15d29;
            transform-origin: top center;
            transform: translateX(-50%) rotate(-25deg);
            border-radius: 12px;
            box-shadow: inset 0 0 0 2px rgba(0,0,0,0.15);
        }
        #bat::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: -22px;
            width: 60px;
            height: 30px;
            background: #d9b37e;
            border-radius: 12px;
        }
        #ball {
            position: absolute;
            left: 50%;
            bottom: 165px;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle at 35% 35%, #fff, #e61d1d);
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 0 4px rgba(255,255,255,0.25);
        }
        #ball.fly {
            animation: ballToCloud 2s ease-in forwards;
        }
        @keyframes ballToCloud {
            0% { bottom: 165px; left: 50%; transform: translateX(-50%) scale(1); }
            40% { bottom: 240px; left: 60%; transform: translateX(-50%) scale(1.05); }
            100% { bottom: 520px; left: 72%; transform: translateX(-50%) scale(0.7); opacity: 0; }
        }
        #bat.hit {
            animation: batSwing 0.6s ease-out forwards;
        }
        @keyframes batSwing {
            0% { transform: translateX(-50%) rotate(-25deg); }
            40% { transform: translateX(-50%) rotate(15deg); }
            100% { transform: translateX(-50%) rotate(5deg); }
        }
        .hint {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.85);
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 14px;
            color: #333;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="hint">Scroll down to swing the bat and send the ball to the cloud</div>
    <div id="scene">
        <div class="cloud"></div>
        <div id="cloud"></div>
        <div class="pitch"></div>
        <div class="stumps">
            <div class="stump"></div>
            <div class="stump"></div>
            <div class="stump"></div>
        </div>
        <div id="bat"></div>
        <div id="ball"></div>
    </div>
    <script>
        const bat = document.getElementById('bat');
        const ball = document.getElementById('ball');
        let triggered = false;
        window.addEventListener('scroll', () => {
            const scroll = window.scrollY || window.pageYOffset;
            if (scroll > 100 && !triggered) {
                triggered = true;
                bat.classList.add('hit');
                ball.classList.add('fly');
            }
            if (scroll < 80 && triggered) {
                triggered = false;
                bat.classList.remove('hit');
                ball.classList.remove('fly');
            }
        });
    </script>
</body>
</html>
