<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }

        h1 {
            font-size: 3rem;
            text-align: center;
        }

        .shadow-box {
            width: 300px;
            padding: 20px;
            margin-top: 20px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(134, 41, 41, 0.2);
            border-radius: 8px;
        }
        p{
            font-size: 1.2rem;
            text-align: center;
            background:linear-gradient(180deg, #aea8a8, #e6e3e0, #b8b8b6, #898b89, #747476, #656566, #787779);
            background-clip: text;
            color:transparent
            filter drop-shadow(0 0 5px rgba(0, 0, 0, 0.5));
        }
    </style>
</head>
<body>
    <h1>Drop Shadow</h1>
    <div class="shadow-box">
        <p>This is a box with a drop shadow effect.</p>
    </div>
    
</body>
</html>
